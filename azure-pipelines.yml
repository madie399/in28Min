trigger:
- master

pool:
  vmImage: ubuntu-latest

steps:
# ✅ Step 1: Welcome message
- script: echo "🚀 Starting Terraform AKS Pipeline"
  displayName: 'Start Message'


- script: |
    echo "🔽 Downloading Terraform (with retry and timeout)..."
    curl --retry 3 --connect-timeout 10 --max-time 60 --location --fail \
      https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip \
      -o terraform.zip

    echo "📦 Unzipping Terraform..."
    unzip terraform.zip

    echo "📁 Moving to /usr/local/bin..."
    sudo mv terraform /usr/local/bin/
    chmod +x /usr/local/bin/terraform

    echo "✅ Terraform Version:"
    terraform version
  displayName: 'Install Terraform 1.5.7 (Safe Download)'


# ✅ Step 3: Download SSH public key (from Library)
- task: DownloadSecureFile@1
  name: publickey
  inputs:
    secureFile: 'azure_rsa.pub'

# ✅ Step 4: Run Terraform Init via shell script
- script: |
    cd $(System.DefaultWorkingDirectory)/configuration/iaac/azure/kubernetes

    terraform init \
      -backend-config="resource_group_name=RG-terraform-aksbuid-001" \
      -backend-config="storage_account_name=stfirstterraformaks001" \
      -backend-config="container_name=containerterraform-aks" \
      -backend-config="key=kubernetes-dev.tfstate" \
      -backend-config="subscription_id=ee319277-edaa-4c07-9b91-04d1eb7bf895" \
      -backend-config="tenant_id=d5d40ca8-b5aa-4d8f-8272-407b515cb5a7"

    echo "✅ Terraform Init Completed"
  displayName: 'Terraform Init (Shell)'

